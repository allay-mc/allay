[package]
name = "allay"
version = "1.0.0"
edition = "2021"
description = "Your Personal Creator Assistant"
documentation = "https://allay-mc.github.io/allay"
homepage = "https://allay-mc.github.io"
repository = "https://github.com/allay-mc/allay"
license = "GPL-3.0-only"
keywords = ["add-on", "assistance", "bedrock", "creator", "minecraft"]

[dependencies]
dirs = "5.0.1"
serde = "1.0.215"
serde_json = "1.0.133"
toml = "0.8.19"
log = "0.4.22"
uuid = { version = "0.8.2", features = ["v4", "serde"] }
time = { version = "0.3.37", features = ["formatting"] }
rhai = { version = "1.20.1", features = ["no_custom_syntax"] }
rhai-fs = "0.1.3"
humantime = "2.1.0"
fs_extra = "1.3.0"
unicode_names2_macros = "1.1.0"
zip-extensions = "0.8.1"
slugify = "0.1.0"
schemars = { version = "0.8.21", features = ["uuid08", "semver"], optional = true }
semver = { version = "1.0.23", features = ["serde"] }
byteorder = "1.5.0"
which = "7.0.1"

[features]
default = ["config-schema"]
config-schema = ["dep:schemars"]

